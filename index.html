<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<title>دليل وصفات القهوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: two views in one column — the recipe guide (one card per bean + drink, approved recipe up front, trials folded below) and the new-trial form */
:root{
  --bg:#eef0ee; --surface:#fbfcfb; --sunk:#e3e7e4; --line:#cdd4cf;
  --fg:#1d2420; --muted:#5f6b64; --accent:#2f6b57; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --warm:#8a5a2b; --warm-soft:#f1e5d6; --danger:#a23a2e; --gold:#9a7417; --gold-soft:#f4ead0;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --sunk:#232b27; --line:#33403a;
  --fg:#e6ece8; --muted:#97a59d; --accent:#6fbf9f; --accent-ink:#0f1d17; --accent-soft:#1f3a30;
  --warm:#d9a46c; --warm-soft:#3a2c1e; --danger:#e58475; --gold:#e2c06a; --gold-soft:#3a3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --sunk:#232b27; --line:#33403a;
  --fg:#e6ece8; --muted:#97a59d; --accent:#6fbf9f; --accent-ink:#0f1d17; --accent-soft:#1f3a30;
  --warm:#d9a46c; --warm-soft:#3a2c1e; --danger:#e58475; --gold:#e2c06a; --gold-soft:#3a3220; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
html[dir="rtl"]{--align:right}
html[dir="ltr"]{--align:left}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.2;text-wrap:balance}
.gear{margin:4px 0 0;color:var(--muted);font-size:.8rem;font-family:var(--mono);direction:ltr;text-align:var(--align);line-height:1.5}
.gear span{white-space:nowrap}
.stats{display:flex;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats>div{white-space:nowrap;padding-inline:14px;border-inline-start:1px solid var(--line);text-align:center}
.stats>div:first-child{border-inline-start:0;padding-inline-start:0}
.stats b{display:block;color:var(--fg);font-family:var(--mono);font-size:1.3rem;font-weight:500;line-height:1.2}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-family:var(--display);font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}

.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* guide */
.filters{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media (max-width:520px){.filters{grid-template-columns:1fr}}
.filters .seg button{font-size:.85rem;padding:6px 12px}
.search{font:inherit;font-size:.92rem;text-overflow:ellipsis;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
.guide{display:grid;gap:14px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r-head{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.r-head h3{font-family:var(--display);font-weight:500;font-size:1.15rem;margin:0;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:.85rem;color:var(--muted);margin:2px 0 0}
.pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.cap{background:var(--warm-soft);color:var(--warm)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:0 18px 10px;color:var(--muted)}
.status.ok{color:var(--gold)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.dial{background:var(--sunk);margin-inline:12px;border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.readout>div{display:grid;gap:4px;align-content:start;padding-inline:10px;border-inline-start:1px solid var(--line);min-width:0}
.readout>div:first-child{border-inline-start:0;padding-inline-start:0}
.readout small{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;direction:ltr;unicode-bidi:isolate;text-align:var(--align)}
.readout b{font-family:var(--mono);font-weight:500;font-size:clamp(.95rem,4.2vw,1.2rem);line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:break-word;word-break:normal}
.readout b.none{color:var(--muted)}
.readout b{direction:ltr;text-align:var(--align);white-space:nowrap}
.readout b em{font-style:normal;font-size:.62em;color:var(--muted);margin-left:3px;letter-spacing:.02em}
.readout b .arr{color:var(--muted);font-size:.8em;margin-inline:3px}
.readout.sub{border-top:1px dashed var(--line);padding-top:10px}
.readout.sub b{font-size:clamp(.85rem,3.6vw,1rem)}
.notes{margin:10px 18px 0;font-size:.9rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.r-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px 14px;flex-wrap:wrap}
.date{font-family:var(--mono);font-size:.74rem;color:var(--muted);direction:ltr}
.tools{display:flex;gap:2px;flex-wrap:wrap}
.icon{font:inherit;font-size:.8rem;background:transparent;border:0;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer}
.icon:hover{background:var(--sunk);color:var(--fg)}
.icon.star{color:var(--gold)}
.icon.confirm{background:var(--danger);color:#fff}
details.trials{border-top:1px solid var(--line)}
details.trials summary{cursor:pointer;list-style:none;padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}
details.trials summary::-webkit-details-marker{display:none}
details.trials summary::after{content:"＋";font-family:var(--mono)}
details.trials[open] summary::after{content:"－"}
.trial{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 18px;border-top:1px dashed var(--line);align-items:center}
.trial .t-spec{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:var(--align);overflow-wrap:anywhere}
.trial .t-note{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.ex{font-size:.68rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}

/* form */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.panel h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
label,.flabel{display:grid;gap:6px;font-size:.82rem;color:var(--muted);font-weight:500}
.lbl-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--accent)}
input,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:var(--align)}
.boxed{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:10px}
.boxed input{background:var(--surface)}
.unit{position:relative}
html[dir="rtl"] .unit input{padding-left:44px}
html[dir="ltr"] .unit input{padding-right:44px}
html[dir="rtl"] .unit span{left:12px}
html[dir="ltr"] .unit span{right:12px}
.unit span{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.85rem;color:var(--muted);pointer-events:none}
details.more summary{cursor:pointer;font-size:.88rem;font-weight:500;color:var(--accent)}
details.more[open] summary{margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:.85rem;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:99px;cursor:pointer;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--fg);font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);padding:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
.msg.err{color:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-weight:500;margin-bottom:4px}
.note{font-size:.8rem;color:var(--danger);text-align:center;margin:0}
.backup{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.backup strong{font-family:var(--display);font-weight:500}
.backup p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.bk-btns{display:flex;gap:10px;flex-wrap:wrap}
.bk-btns .btn{padding:8px 16px;font-size:.9rem}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding-top:6px}
.foot .ver{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.foot a{font-weight:500;color:var(--fg);text-decoration:none;direction:ltr;unicode-bidi:isolate}
.foot a:hover{text-decoration:underline}
.top{display:flex;justify-content:flex-end}
.update{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.up-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.update .ver{font-size:.82rem;color:var(--muted)}
.up-btn{padding:7px 14px;font-size:.88rem}
.up-btn.new{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.up-btn:disabled{opacity:.6;cursor:progress}
.lang{font:inherit;font-size:.8rem;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.lang:hover{color:var(--fg);border-color:var(--muted)}
.lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><button class="lang" id="langBtn" type="button" lang="en">English</button></div>
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="gear"><span>Slayer</span> · <span>Monolith</span> · <span>HG-1</span></p>
    </div>
    <div class="stats">
      <div><b id="s-rec">0</b><span data-i18n="statRec"></span></div>
      <div><b id="s-tri">0</b><span data-i18n="statTri"></span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-guide" aria-selected="true" type="button" data-i18n="tabGuide"></button>
    <button role="tab" id="tab-new" aria-selected="false" type="button" data-i18n="tabNew"></button>
  </nav>

  <section id="view-guide" style="display:grid;gap:14px">
    <div class="filters">
      <input class="search" id="q" type="search" data-i18n-ph="search">
      <div class="seg" role="group" id="filter" data-i18n-aria="drink">
        <button type="button" data-v="" aria-pressed="true" data-i18n="all"></button>
        <button type="button" data-v="فلات وايت" aria-pressed="false" data-i18n="flatWhite"></button>
        <button type="button" data-v="كابتشينو" aria-pressed="false" data-i18n="cappuccino"></button>
      </div>
    </div>
    <div class="guide" id="guide"></div>
    <p class="note" id="note" hidden></p>
  </section>

  <form class="panel" id="form" autocomplete="off" hidden>
    <h2 id="formTitle"></h2>
    <div class="grid">
      <label class="full"><span data-i18n="fName"></span>
        <input id="f-name" required data-i18n-ph="phName">
      </label>
      <label class="full"><span data-i18n="fCountry"></span>
        <input id="f-country" data-i18n-ph="phPick">
        <div class="chips" id="c-country" role="group" data-i18n-aria="fCountry"></div>
      </label>
      <label class="full"><span data-i18n="fRoaster"></span>
        <input id="f-roaster" data-i18n-ph="phPick">
        <div class="chips" id="c-roaster" role="group" data-i18n-aria="fRoaster"></div>
      </label>
      <div class="flabel full"><span data-i18n="fGrind"></span>
        <div class="boxed">
          <label><span class="lbl-tag">MONOLITH</span><input id="f-mono" class="num" inputmode="decimal" placeholder="—"></label>
          <label><span class="lbl-tag">HG-1</span><input id="f-hg1" class="num" inputmode="decimal" placeholder="—"></label>
        </div>
      </div>
      <label><span data-i18n="fTemp"></span>
        <div class="unit"><input id="f-temp" class="num" type="number" step="0.5" min="80" max="100" value="93"><span>°C</span></div>
      </label>
      <div class="flabel"><span data-i18n="drink"></span>
        <div class="seg" role="group" id="f-drink" data-i18n-aria="drink">
          <button type="button" data-v="فلات وايت" aria-pressed="true" data-i18n="flatWhite"></button>
          <button type="button" data-v="كابتشينو" aria-pressed="false" data-i18n="cappuccino"></button>
        </div>
      </div>
      <details class="more full" id="more">
        <summary data-i18n="more"></summary>
        <div style="display:grid;gap:14px">
          <div class="boxed">
            <label><span data-i18n="fDose"></span><div class="unit"><input id="f-dose" class="num" type="number" step="0.1" min="0" placeholder="18"><span>g</span></div></label>
            <label><span data-i18n="fYield"></span><div class="unit"><input id="f-yield" class="num" type="number" step="0.1" min="0" placeholder="36"><span>g</span></div></label>
            <label><span data-i18n="fTime"></span><div class="unit"><input id="f-time" class="num" type="number" step="1" min="0" placeholder="28"><span>s</span></div></label>
          </div>
          <label><span data-i18n="fNotes"></span>
            <textarea id="f-notes" data-i18n-ph="phNotes"></textarea>
          </label>
        </div>
      </details>
      <label class="check full"><input type="checkbox" id="f-fav"> <span data-i18n="fFav"></span></label>
    </div>
    <div class="actions">
      <button class="btn primary" id="save" type="submit"></button>
      <button class="btn ghost" id="cancel" type="button" data-i18n="cancel"></button>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>

  <section class="backup" id="backup">
    <div>
      <strong data-i18n="bkTitle"></strong>
      <p data-i18n="bkBody"></p>
    </div>
    <div class="bk-btns">
      <button class="btn ghost" id="exportBtn" type="button" data-i18n="export"></button>
      <button class="btn ghost" id="importBtn" type="button" data-i18n="import"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="msg" id="bkMsg" aria-live="polite"></p>
  </section>

  <section class="update" id="updateBar">
    <div class="up-row">
      <span class="ver" id="ver"></span>
      <button class="btn ghost up-btn" id="updBtn" type="button"></button>
    </div>
    <p class="msg" id="updMsg" aria-live="polite"></p>
  </section>

  <footer class="foot"><span class="credit" id="credit"></span></footer>
</div>

<script>
(() => {
  const VERSION="1.3.0";
  const $ = id => document.getElementById(id);

  /* ---------- language ---------- */
  const STR={
    ar:{
      title:"دليل وصفات القهوة", statRec:"وصفة معتمدة", statTri:"تجربة",
      tabGuide:"الدليل", tabNew:"تجربة جديدة",
      search:"ابحث بالمحصول أو البلد أو المحمصة", all:"الكل", drink:"المشروب",
      flatWhite:"فلات وايت", cappuccino:"كابتشينو",
      emptyT:"لا توجد وصفات بعد", emptyB:"سجّل تجربتك الأولى من «تجربة جديدة»، ثم اعتمد ما يعجبك منها لتصبح وصفةً تعود إليها.",
      noResT:"لا توجد نتائج", noResB:"جرّب كلمة بحث أخرى أو غيّر التصفية.",
      approved:"الوصفة المعتمدة", latest:"آخر تجربة، ولم تُعتمد وصفة بعد",
      prev:"التجارب السابقة ({n})", example:"مثال", unnamed:"بلا اسم",
      aFav:"اعتماد", aTry:"تجربة عليها", aDup:"تكرار", aEdit:"تعديل", aDel:"حذف", aConfirm:"تأكيد الحذف",
      formNew:"تجربة جديدة", formEdit:"تعديل التجربة",
      fName:"اسم المحصول", phName:"مثال: سيدامو بنسالي",
      fCountry:"بلد المنشأ", fRoaster:"المحمصة", phPick:"اختر مما يلي أو اكتب",
      fGrind:"درجة الطحن", fTemp:"درجة الحرارة",
      more:"تفاصيل إضافية (اختيارية)", fDose:"الجرعة", fYield:"الناتج", fTime:"الوقت",
      fNotes:"ملاحظات التذوق", phNotes:"مثال: حلاوة واضحة، وحموضة خفيفة، وطغى الحليب على النكهة قليلًا…",
      fFav:"اعتمادها وصفةً لهذا المحصول",
      save:"حفظ التجربة", saveEdit:"حفظ التعديل", cancel:"إلغاء",
      errName:"يُرجى كتابة اسم المحصول أولًا.", errSave:"تعذّر الحفظ. حاول مرة أخرى.",
      dupMsg:"نُسخت إعدادات هذه الوصفة إلى النموذج. غيّر ما تريد تجربته ثم احفظ.",
      bkTitle:"النسخة الاحتياطية",
      bkBody:"تُحفظ تجاربك في هذا المتصفح فقط. صدّر نسخةً بعد كل وصفة جديدة، واستوردها عند تغيير الجهاز أو مسح بيانات المتصفح.",
      export:"تصدير نسخة", import:"استيراد نسخة",
      exported:"نُزّلت النسخة الاحتياطية.", imported:"تم استيراد التجارب: {n}",
      badFile:"هذا الملف ليس نسخة احتياطية صالحة من الدليل.",
      storageOff:"يمنع المتصفح الحفظ هنا (التصفح الخفي أو حظر بيانات المواقع). صدّر نسخة احتياطية قبل إغلاق الصفحة.",
      credit:"من إعداد {h} على تيليجرام", langBtn:"English",
      ver:"الإصدار {n}", upCheck:"التحقق من التحديثات", upChecking:"جارٍ التحقق…", upGo:"التحديث إلى الإصدار {n}", upLatest:"أنت تستخدم أحدث إصدار.", upNew:"يتوفر إصدار جديد. بياناتك محفوظة ولن تتأثر بالتحديث.", upFail:"تعذّر التحقق. تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.", upDone:"تم التحديث إلى الإصدار {n}."
    },
    en:{
      title:"Coffee Recipe Guide", statRec:"approved", statTri:"trials",
      tabGuide:"Guide", tabNew:"New trial",
      search:"Search bean, origin, or roaster", all:"All", drink:"Drink",
      flatWhite:"Flat White", cappuccino:"Cappuccino",
      emptyT:"No recipes yet", emptyB:"Log your first trial under “New trial”, then approve the one you like so it becomes a recipe you can come back to.",
      noResT:"No results", noResB:"Try another search term or change the filter.",
      approved:"Approved recipe", latest:"Latest trial, no recipe approved yet",
      prev:"Earlier trials ({n})", example:"Example", unnamed:"Untitled",
      aFav:"Approve", aTry:"Try a variation", aDup:"Duplicate", aEdit:"Edit", aDel:"Delete", aConfirm:"Confirm delete",
      formNew:"New trial", formEdit:"Edit trial",
      fName:"Bean name", phName:"e.g. Sidamo Bensa",
      fCountry:"Origin", fRoaster:"Roaster", phPick:"Pick below or type",
      fGrind:"Grind setting", fTemp:"Temperature",
      more:"More details (optional)", fDose:"Dose", fYield:"Yield", fTime:"Time",
      fNotes:"Tasting notes", phNotes:"e.g. clear sweetness, light acidity, milk muted the flavor a little…",
      fFav:"Approve as the recipe for this bean",
      save:"Save trial", saveEdit:"Save changes", cancel:"Cancel",
      errName:"Enter the bean name first.", errSave:"Couldn't save. Try again.",
      dupMsg:"Copied this recipe's settings into the form. Change what you want to test, then save.",
      bkTitle:"Backup",
      bkBody:"Your trials are saved in this browser only. Export a copy after each new recipe, and import it when you switch devices or clear browser data.",
      export:"Export backup", import:"Import backup",
      exported:"Backup downloaded.", imported:"Imported {n} trials.",
      badFile:"This file isn't a valid backup from the guide.",
      storageOff:"This browser is blocking storage here (private mode or blocked site data). Export a backup before you close the page.",
      credit:"Made by {h} on Telegram", langBtn:"العربية",
      ver:"Version {n}", upCheck:"Check for updates", upChecking:"Checking…", upGo:"Update to version {n}", upLatest:"You're on the latest version.", upNew:"A new version is available. Your data stays saved and isn't affected by the update.", upFail:"Couldn't check. Make sure you're online, then try again.", upDone:"Updated to version {n}."
    }
  };
  /* stored values stay Arabic; these give their English labels */
  const LABELS={
    country:{"برازيلي":"Brazil","إثيوبي":"Ethiopia","كولومبي":"Colombia","كيني":"Kenya","يمني":"Yemen","رواندي":"Rwanda","بوروندي":"Burundi","هندوراسي":"Honduras","غواتيمالي":"Guatemala","بنمي":"Panama","كوستاريكي":"Costa Rica","بيروفي":"Peru","سلفادوري":"El Salvador","إندونيسي":"Indonesia","مكسيكي":"Mexico"},
    roaster:{"قاف":"Qaf","اوروس":"Orous","انديز":"Andes","سلالات القهوة":"Sulalat Coffee","كفه":"Kaffa","خطوة جمل":"Camel Step"},
    drink:{"فلات وايت":"Flat White","كابتشينو":"Cappuccino"}
  };
  const LANG_KEY="coffee-recipes-lang";
  let lang="ar";
  try{ const l=localStorage.getItem(LANG_KEY); if(l==="en"||l==="ar") lang=l; }catch(e){}
  const T=(k,n)=>{ const s=(STR[lang][k]??STR.ar[k]??k); return n==null?s:s.replace("{n}",n); };
  const disp=(field,val)=> lang==="en" ? (LABELS[field][val]||val) : val;
  const canon=(field,val)=>{
    const v=norm(val); if(lang!=="en") return v;
    const hit=Object.entries(LABELS[field]).find(([,en])=>en.toLowerCase()===v.toLowerCase());
    return hit?hit[0]:v;
  };

  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm=s=>String(s??"").trim().replace(/\s+/g," ");
  const has=x=>!(x===""||x==null);

  const form=$("form"), guide=$("guide"), msg=$("msg"), note=$("note");
  const KEY="coffee-recipes-v1";
  const SEED=[{"id":"xo2th3r7y7qdwf5kga5o","country":"برازيلي","createdAt":1791376873364,"dose":18,"drink":"فلات وايت","fav":true,"hg1":"10.2","monolith":"","name":"موجيانا","notes":"","roaster":"انديز","temp":91.5,"time":25,"yield":27}];
  let entries=[], editing=null, filter="", query="", pendingDel=null, persistent=true, view="guide";
  const openGroups=new Set();

  function applyLang(){
    const root=document.documentElement;
    root.lang=lang; root.dir= lang==="ar"?"rtl":"ltr";
    document.title=T("title");
    document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=T(el.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",T(el.dataset.i18nAria)));
    const lb=$("langBtn"); lb.textContent=T("langBtn"); lb.lang= lang==="ar"?"en":"ar";
    $("ver").textContent=T("ver","v"+VERSION);
    paintUpd();
    const [pre,post]=T("credit").split("{h}");
    $("credit").innerHTML=esc(pre)+'<a href="https://t.me/talaquf" target="_blank" rel="noopener">@talaquf</a>'+esc(post);
    $("formTitle").textContent= editing?T("formEdit"):T("formNew");
    $("save").textContent= editing?T("saveEdit"):T("save");
    banner(); render(); renderChips();
  }
  $("langBtn").onclick=()=>{
    const c=canon("country",$("f-country").value), r=canon("roaster",$("f-roaster").value);
    lang= lang==="ar"?"en":"ar";
    try{ localStorage.setItem(LANG_KEY,lang); }catch(e){}
    $("f-country").value=c?disp("country",c):""; $("f-roaster").value=r?disp("roaster",r):"";
    msg.textContent=""; $("bkMsg").textContent="";
    applyLang();
  };

  /* ---------- chips ---------- */
  const COUNTRIES=Object.keys(LABELS.country), ROASTERS=Object.keys(LABELS.roaster);
  function chipRow(boxId,inputId,base,field){
    const box=$(boxId), inp=$(inputId);
    const used=[...new Set(entries.map(e=>norm(e[field])).filter(Boolean))];
    const all=[...used.filter(x=>base.includes(x)), ...base.filter(x=>!used.includes(x)), ...used.filter(x=>!base.includes(x))];
    const cur=canon(field,inp.value);
    box.innerHTML=all.map(v=>`<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(disp(field,v))}</button>`).join("");
  }
  function renderChips(){ chipRow("c-country","f-country",COUNTRIES,"country"); chipRow("c-roaster","f-roaster",ROASTERS,"roaster"); }
  [["c-country","f-country","country"],["c-roaster","f-roaster","roaster"]].forEach(([b,i,field])=>{
    $(b).addEventListener("click",e=>{
      const c=e.target.closest(".chip"); if(!c) return;
      const inp=$(i); inp.value = canon(field,inp.value)===c.dataset.v ? "" : disp(field,c.dataset.v);
      renderChips();
    });
    $(i).addEventListener("input",renderChips);
  });

  /* ---------- views ---------- */
  function show(tab){
    view=tab; const g= tab==="guide";
    $("tab-guide").setAttribute("aria-selected",String(g));
    $("tab-new").setAttribute("aria-selected",String(!g));
    $("view-guide").hidden=!g; $("backup").hidden=!g; form.hidden=g;
    if(!g){ renderChips(); $("f-name").focus({preventScroll:true}); }
  }
  $("tab-guide").onclick=()=>show("guide");
  $("tab-new").onclick=()=>{ if(!editing) resetForm(); show("new"); };

  const setSeg=(el,v)=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  const segVal=el=>el.querySelector('[aria-pressed="true"]').dataset.v;
  $("f-drink").onclick=e=>{const b=e.target.closest("button"); if(b) setSeg($("f-drink"),b.dataset.v);};
  $("filter").onclick=e=>{const b=e.target.closest("button"); if(!b) return; filter=b.dataset.v; setSeg($("filter"),filter); render();};
  $("q").oninput=e=>{query=e.target.value.trim(); render();};

  /* ---------- render ---------- */
  const keyOf=e=>[norm(e.name),norm(e.roaster),e.drink||""].join("|");
  const fmtDate=t=>{ if(!t) return ""; return new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
  const val=x=>{
    if(!has(x)) return '<b class="none">—</b>';
    const m=String(x).trim().match(/^([\d.,٠-٩]+)\s*(.*)$/);
    return m ? `<b>${esc(m[1])}${m[2]?`<em>${esc(m[2])}</em>`:""}</b>` : `<b>${esc(x)}</b>`;
  };
  function ratioLine(e){
    if(!has(e.dose)&&!has(e.yield)&&!has(e.time)) return "";
    const r=(has(e.dose)&&has(e.yield)&&Number(e.dose)>0)?"1:"+(Number(e.yield)/Number(e.dose)).toFixed(1):"";
    const dy=(has(e.dose)||has(e.yield))?`<b>${has(e.dose)?esc(e.dose):"—"}<span class="arr">→</span>${has(e.yield)?esc(e.yield):"—"}<em>g</em></b>`:'<b class="none">—</b>';
    return `<div class="readout sub">
      <div><small>In → Out</small>${dy}</div>
      <div><small>Ratio</small>${r?`<b>${r}</b>`:'<b class="none">—</b>'}</div>
      <div><small>Time</small>${has(e.time)?`<b>${esc(e.time)}<em>s</em></b>`:'<b class="none">—</b>'}</div>
    </div>`;
  }
  function tools(e,isMain){
    const del=pendingDel===e.id;
    return `<div class="tools">
      ${e.fav?"":`<button class="icon star" data-act="fav" data-id="${esc(e.id)}" type="button">${T("aFav")}</button>`}
      <button class="icon" data-act="dup" data-id="${esc(e.id)}" type="button">${isMain?T("aTry"):T("aDup")}</button>
      <button class="icon" data-act="edit" data-id="${esc(e.id)}" type="button">${T("aEdit")}</button>
      <button class="icon ${del?"confirm":""}" data-act="del" data-id="${esc(e.id)}" type="button">${del?T("aConfirm"):T("aDel")}</button>
    </div>`;
  }
  function render(){
    const groups=new Map();
    entries.forEach(e=>{const k=keyOf(e); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e);});
    let list=[...groups.entries()].map(([k,items])=>{
      items.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const main=items.find(x=>x.fav)||items[0];
      return {k,items,main,approved:!!items.find(x=>x.fav)};
    });
    $("s-rec").textContent=list.filter(g=>g.approved).length;
    $("s-tri").textContent=entries.length;

    if(filter) list=list.filter(g=>g.main.drink===filter);
    if(query){
      const q=query.toLowerCase();
      list=list.filter(g=>{const m=g.main; return [m.name,m.country,m.roaster,disp("country",m.country),disp("roaster",m.roaster)].some(x=>String(x||"").toLowerCase().includes(q));});
    }
    list.sort((a,b)=>(b.approved-a.approved)||((b.items[0].createdAt||0)-(a.items[0].createdAt||0)));

    if(!list.length){
      guide.innerHTML = entries.length
        ? `<div class="empty"><strong>${T("noResT")}</strong>${T("noResB")}</div>`
        : `<div class="empty"><strong>${T("emptyT")}</strong>${esc(T("emptyB"))}</div>`;
      return;
    }
    guide.innerHTML=list.map(g=>{
      const m=g.main, others=g.items.filter(x=>x!==m);
      const meta=[m.country&&disp("country",m.country), m.roaster&&disp("roaster",m.roaster)].filter(Boolean).map(esc).join(" · ")||"—";
      return `<article class="recipe">
        <div class="r-head">
          <div style="min-width:0">
            <h3>${esc(m.name||T("unnamed"))}${m.example?`<span class="ex">${T("example")}</span>`:""}</h3>
            <p class="meta">${meta}</p>
          </div>
          <span class="pill ${m.drink==="كابتشينو"?"cap":""}">${esc(disp("drink",m.drink||""))}</span>
        </div>
        <div class="status ${g.approved?"ok":""}"><i></i>${g.approved?T("approved"):T("latest")}</div>
        <div class="dial">
          <div class="readout">
            <div><small>Monolith</small>${val(m.monolith)}</div>
            <div><small>HG-1</small>${val(m.hg1)}</div>
            <div><small>Temp °C</small>${val(m.temp)}</div>
          </div>
          ${ratioLine(m)}
        </div>
        ${has(m.notes)?`<p class="notes">${esc(m.notes)}</p>`:""}
        <div class="r-foot"><span class="date">${fmtDate(m.createdAt)}</span>${tools(m,true)}</div>
        ${others.length?`<details class="trials" data-k="${esc(g.k)}" ${openGroups.has(g.k)?"open":""}>
          <summary>${T("prev",others.length)}</summary>
          ${others.map(t=>`<div class="trial">
            <div class="t-spec">M ${has(t.monolith)?esc(t.monolith):"—"} · HG ${has(t.hg1)?esc(t.hg1):"—"} · ${has(t.temp)?esc(t.temp)+"°C":"—"}${has(t.dose)?` · ${esc(t.dose)}→${has(t.yield)?esc(t.yield):"—"}g`:""}${has(t.time)?` · ${esc(t.time)}s`:""} · <span style="color:var(--muted)">${fmtDate(t.createdAt)}</span></div>
            ${tools(t,false)}
            ${has(t.notes)?`<p class="t-note">${esc(t.notes)}</p>`:""}
          </div>`).join("")}
        </details>`:""}
      </article>`;
    }).join("");
    guide.querySelectorAll("details.trials").forEach(d=>d.addEventListener("toggle",()=>{d.open?openGroups.add(d.dataset.k):openGroups.delete(d.dataset.k);}));
  }

  /* ---------- form ---------- */
  function fill(e){
    $("f-name").value=e.name||"";
    $("f-country").value=e.country?disp("country",e.country):"";
    $("f-roaster").value=e.roaster?disp("roaster",e.roaster):"";
    $("f-mono").value=e.monolith??""; $("f-hg1").value=e.hg1??""; $("f-temp").value=e.temp??93;
    $("f-dose").value=e.dose??""; $("f-yield").value=e.yield??""; $("f-time").value=e.time??""; $("f-notes").value=e.notes||"";
    $("more").open= has(e.dose)||has(e.yield)||has(e.time)||has(e.notes);
    setSeg($("f-drink"),e.drink||"فلات وايت");
    renderChips();
  }
  function resetForm(){
    editing=null; form.reset(); $("f-temp").value=93; setSeg($("f-drink"),"فلات وايت"); $("more").open=false;
    $("formTitle").textContent=T("formNew"); $("save").textContent=T("save"); msg.textContent="";
  }
  $("cancel").onclick=()=>{resetForm(); show("guide");};

  /* ---------- storage ---------- */
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(entries)); }catch(e){ persistent=false; banner(); } }
  function load(){ try{ const raw=localStorage.getItem(KEY); return raw===null?null:JSON.parse(raw); }catch(e){ persistent=false; return null; } }
  function banner(){ if(!persistent){ note.hidden=false; note.textContent=T("storageOff"); } }
  function write(id,body){
    const i=entries.findIndex(x=>x.id===id);
    if(i>-1) entries[i]={id,...body}; else entries.unshift({id,...body});
    entries.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); save(); render();
  }
  const strip=e=>{const {id,...rest}=e; return rest;};
  function makeFav(id){
    const e=entries.find(x=>x.id===id); if(!e) return;
    const k=keyOf(e);
    entries.filter(x=>keyOf(x)===k && x.fav && x.id!==id).forEach(o=>write(o.id,{...strip(o),fav:false}));
    write(id,{...strip(e),fav:true});
  }

  guide.addEventListener("click",ev=>{
    const b=ev.target.closest("button[data-act]"); if(!b) return;
    const id=b.dataset.id, e=entries.find(x=>x.id===id); if(!e) return;
    const act=b.dataset.act;
    if(act==="fav") makeFav(id);
    if(act==="edit"){ resetForm(); editing=id; fill(e); $("f-fav").checked=!!e.fav; $("formTitle").textContent=T("formEdit"); $("save").textContent=T("saveEdit"); show("new"); }
    if(act==="dup"){ resetForm(); fill(e); $("f-notes").value=""; msg.className="msg"; msg.textContent=T("dupMsg"); show("new"); }
    if(act==="del"){
      if(pendingDel!==id){ pendingDel=id; render(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null; render();} },4000); return; }
      pendingDel=null; entries=entries.filter(x=>x.id!==id); save(); render();
    }
  });

  form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const name=norm($("f-name").value);
    if(!name){ msg.className="msg err"; msg.textContent=T("errName"); $("f-name").focus(); return; }
    const num=x=>x===""?"":Number(x);
    const old=editing?entries.find(x=>x.id===editing):null;
    const body={ name, country:canon("country",$("f-country").value), roaster:canon("roaster",$("f-roaster").value),
      monolith:$("f-mono").value.trim(), hg1:$("f-hg1").value.trim(), temp:num($("f-temp").value),
      drink:segVal($("f-drink")), dose:num($("f-dose").value), yield:num($("f-yield").value), time:num($("f-time").value),
      notes:$("f-notes").value.trim(), fav:false, createdAt: old?.createdAt||Date.now() };
    if(old) body.updatedAt=Date.now();
    try{
      const id= editing || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      write(id,body);
      if($("f-fav").checked) makeFav(id);
      resetForm(); show("guide");
    }catch(err){ msg.className="msg err"; msg.textContent=T("errSave"); }
  });

  /* ---------- backup ---------- */
  $("exportBtn").onclick=()=>{
    const data={app:"coffee-recipes",version:VERSION,exportedAt:new Date().toISOString(),entries};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="coffee-recipes-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    $("bkMsg").textContent=T("exported");
  };
  $("importBtn").onclick=()=>$("importFile").click();
  $("importFile").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text()); const list=Array.isArray(d)?d:d.entries;
      if(!Array.isArray(list)) throw 0;
      let n=0; list.forEach(x=>{ if(x&&x.id&&x.name){ const i=entries.findIndex(y=>y.id===x.id); if(i>-1) entries[i]=x; else entries.push(x); n++; } });
      entries.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); save(); render(); renderChips();
      $("bkMsg").textContent=T("imported",n);
    }catch(err){ $("bkMsg").textContent=T("badFile"); }
    e.target.value="";
  };

  /* ---------- updates ---------- */
  let latest=null, updState="idle"; /* idle | checking | latest | new | fail */
  const newer=(a,b)=>{ const x=a.split(".").map(Number), y=b.split(".").map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; };
  function paintUpd(){
    const b=$("updBtn"), m=$("updMsg");
    b.disabled= updState==="checking";
    b.classList.toggle("new", updState==="new");
    b.textContent= updState==="checking"?T("upChecking"): updState==="new"?T("upGo","v"+latest):T("upCheck");
    m.className= "msg"+(updState==="fail"?" err":"");
    m.textContent= updState==="latest"?T("upLatest"): updState==="new"?T("upNew"): updState==="fail"?T("upFail"): updState==="done"?T("upDone","v"+VERSION):"";
  }
  async function checkUpdate(silent){
    if(!silent){ updState="checking"; paintUpd(); }
    try{
      const res=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
      if(!res.ok) throw 0;
      const m=(await res.text()).match(/const VERSION="([\d.]+)"/);
      if(!m) throw 0;
      latest=m[1];
      if(newer(latest,VERSION)) updState="new";
      else if(!silent) updState="latest";
    }catch(e){ if(!silent) updState="fail"; }
    paintUpd();
  }
  $("updBtn").onclick=()=>{
    if(updState==="new"){ location.replace(location.pathname+"?v="+latest+"&t="+Date.now()); return; }
    checkUpdate(false);
  };
  /* after an update, tidy the address bar and confirm */
  (()=>{ const q=new URLSearchParams(location.search); if(q.has("v")){ if(q.get("v")===VERSION) updState="done"; try{ history.replaceState(null,"",location.pathname); }catch(e){} } })();

  /* ---------- start ---------- */
  const saved=load();
  entries= saved ?? SEED;
  if(saved===null && persistent) save();
  resetForm();
  applyLang();
  if(location.protocol.startsWith("http")) checkUpdate(true);
})();
</script>
</body>
</html>
