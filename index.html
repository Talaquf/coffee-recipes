<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141917" id="themeColor">
<script>
/* apply saved theme and text size before first paint */
(function(){var t="dark",f=1;try{var o=JSON.parse(localStorage.getItem("coffee-recipes-settings")||"{}");if(o.theme==="light")t="light";if(o.fontScale)f=+o.fontScale||1;}catch(e){}
var d=document.documentElement;d.setAttribute("data-theme",t);d.style.setProperty("--fs",f);
document.getElementById("themeColor").setAttribute("content",t==="light"?"#eef0ee":"#141917");})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="دليل القهوة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>دليل وصفات القهوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: two views in one column — the recipe guide (one card per bean + drink, approved recipe up front, trials folded below) and the new-trial form */
:root{
  --bg:#eef0ee; --surface:#fbfcfb; --sunk:#e3e7e4; --line:#cdd4cf;
  --fg:#1d2420; --muted:#5f6b64; --accent:#2f6b57; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --warm:#8a5a2b; --warm-soft:#f1e5d6; --danger:#a23a2e; --gold:#9a7417; --gold-soft:#f4ead0;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --col2:9.5rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --sunk:#232b27; --line:#33403a;
  --fg:#e6ece8; --muted:#97a59d; --accent:#6fbf9f; --accent-ink:#0f1d17; --accent-soft:#1f3a30;
  --warm:#d9a46c; --warm-soft:#3a2c1e; --danger:#e58475; --gold:#e2c06a; --gold-soft:#3a3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --sunk:#232b27; --line:#33403a;
  --fg:#e6ece8; --muted:#97a59d; --accent:#6fbf9f; --accent-ink:#0f1d17; --accent-soft:#1f3a30;
  --warm:#d9a46c; --warm-soft:#3a2c1e; --danger:#e58475; --gold:#e2c06a; --gold-soft:#3a3220; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{font-size:calc(16px * var(--fs,1))}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.6}
html[dir="rtl"]{--align:right}
html[dir="ltr"]{--align:left}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:20px}
header{display:grid;gap:16px;text-align:center}
header>div{min-width:0;width:100%}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.2;text-wrap:balance}
.gear{margin:6px 0 0;color:var(--muted);font-size:.85rem;font-family:var(--body);direction:ltr;line-height:1.5;display:flex;flex-wrap:wrap;justify-content:center;row-gap:2px}
.gear span{white-space:nowrap}
.gear span+span::before{content:"·";margin-inline:7px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,var(--col2)));justify-content:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats>div{white-space:nowrap;padding-inline:8px;border-inline-start:1px solid var(--line);text-align:center;min-width:0}
.stats>div:first-child{border-inline-start:0}
.stats b{display:block;color:var(--fg);font-family:var(--mono);font-size:1.3rem;font-weight:500;line-height:1.2}

.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,var(--col2)));justify-content:center;border-bottom:1px solid var(--line)}
.tabs button{text-align:center;white-space:nowrap;font:inherit;font-family:var(--display);font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}

.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* guide */
.filters{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media (max-width:520px){.filters{grid-template-columns:1fr}}
.filters .seg button{font-size:.85rem;padding:6px 12px}
.search{font:inherit;font-size:max(16px,.92rem);text-overflow:ellipsis;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
.guide{display:grid;gap:14px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r-head{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.r-head h3{font-family:var(--display);font-weight:500;font-size:1.15rem;margin:0;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:.92rem;color:var(--muted);margin:2px 0 0}
.pill{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.cap{background:var(--warm-soft);color:var(--warm)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:0 18px 10px;color:var(--muted)}
.status.ok{color:var(--gold)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.dial{background:var(--sunk);margin-inline:12px;border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.readout{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.readout>div{display:grid;gap:4px;align-content:start;padding-inline:10px;border-inline-start:1px solid var(--line);min-width:0}
.readout>div:first-child{border-inline-start:0;padding-inline-start:0}
.readout small{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;direction:ltr;unicode-bidi:isolate;text-align:var(--align)}
.readout b{font-family:var(--mono);font-weight:500;font-size:clamp(1.12rem,5vw,1.4rem);line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:break-word;word-break:normal}
.readout b.none{color:var(--muted)}
.readout b{direction:ltr;text-align:var(--align);white-space:nowrap}
.readout b em{font-style:normal;font-size:.74em;color:var(--muted);margin-left:3px;letter-spacing:.02em}
.readout b .arr{color:var(--muted);font-size:.8em;margin-inline:3px}
.readout.sub{border-top:1px dashed var(--line);padding-top:10px}
.readout.sub b{font-size:clamp(1rem,4.4vw,1.18rem)}
.notes{margin:10px 18px 0;font-size:.98rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.r-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px 14px;flex-wrap:wrap}
.date{font-family:var(--mono);font-size:.82rem;color:var(--muted);direction:ltr}
.tools{display:flex;gap:2px;flex-wrap:wrap}
.icon{font:inherit;font-size:.9rem;background:transparent;border:0;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer}
.icon:hover{background:var(--sunk);color:var(--fg)}
.icon.star{color:var(--gold)}
.icon.confirm{background:var(--danger);color:#fff}
details.trials{border-top:1px solid var(--line)}
details.trials summary{cursor:pointer;list-style:none;padding:10px 18px;font-size:.92rem;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}
details.trials summary::-webkit-details-marker{display:none}
details.trials summary::after{content:"＋";font-family:var(--mono)}
details.trials[open] summary::after{content:"－"}
.trial{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 18px;border-top:1px dashed var(--line);align-items:center}
.trial .t-spec{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:var(--align);overflow-wrap:anywhere}
.trial .t-note{grid-column:1/-1;font-size:.9rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.ex{font-size:.68rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}

/* form */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.panel h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
label,.flabel{display:grid;gap:6px;font-size:.82rem;color:var(--muted);font-weight:500}
.lbl-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--accent)}
input,textarea{font:inherit;font-size:max(16px,1rem);color:var(--fg);background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:var(--align)}
.boxed{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:10px}
.boxed input{background:var(--surface)}
.g-field{display:grid;gap:6px;min-width:0}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pref{font:inherit;font-size:.75rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pref::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.pref[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.pref[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.pref:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-inline-end:6px;vertical-align:middle;position:relative;top:-1px}
.unit{position:relative}
html[dir="rtl"] .unit input{padding-left:44px}
html[dir="ltr"] .unit input{padding-right:44px}
html[dir="rtl"] .unit span{left:12px}
html[dir="ltr"] .unit span{right:12px}
.unit span{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.85rem;color:var(--muted);pointer-events:none}
details.more summary{cursor:pointer;font-size:.88rem;font-weight:500;color:var(--accent)}
details.more[open] summary{margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:.85rem;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:99px;cursor:pointer;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--fg);font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);padding:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
.msg.err{color:var(--danger)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-weight:500;margin-bottom:4px}
.note{font-size:.8rem;color:var(--danger);text-align:center;margin:0}
.backup{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.backup strong{font-family:var(--display);font-weight:500}
.backup p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.bk-btns{display:flex;gap:10px;flex-wrap:wrap}
.bk-btns .btn{padding:8px 16px;font-size:.9rem}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding-top:6px}
.foot .ver{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.foot a{font-weight:500;color:var(--fg);text-decoration:none;direction:ltr;unicode-bidi:isolate}
.foot a:hover{text-decoration:underline}
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:0}
.icon-btn:hover,.icon-btn[aria-pressed="true"]{color:var(--fg);border-color:var(--muted)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:18px;height:18px}
.card-note{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.card-note strong{font-family:var(--display);font-weight:500}
.card-note p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.card-note .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-note .btn{padding:7px 14px;font-size:.88rem}
.card-note.warn{border-color:var(--gold);background:var(--gold-soft)}
.card-note.warn strong{color:var(--gold)}
.note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{font:inherit;line-height:1;background:transparent;border:0;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:6px;cursor:pointer;flex:none}
.x:hover{color:var(--fg);background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;box-shadow:0 4px 14px rgb(0 0 0 / .25);z-index:10;max-width:calc(100% - 32px)}
.set-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.set-head .btn{padding:7px 16px}
.g-list{display:grid;gap:8px}
.g-row{display:flex;gap:8px;align-items:center}
.g-row input{flex:1}
.g-row .icon{flex:none}
.set-sec{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.set-sub{font-family:var(--display);font-weight:500;font-size:.95rem;color:var(--fg);margin:0}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.update{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.up-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.update .ver{font-size:.82rem;color:var(--muted)}
.up-btn{padding:7px 14px;font-size:.88rem}
.up-btn.new{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.up-btn:disabled{opacity:.6;cursor:progress}
.lang{font:inherit;font-size:.8rem;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.lang:hover{color:var(--fg);border-color:var(--muted)}
.lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <button class="lang" id="langBtn" type="button" lang="en">English</button>
    <button class="icon-btn" id="setBtn" type="button" aria-pressed="false" data-i18n-aria="setTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="gear" id="gearLine"></p>
    </div>
    <div class="stats">
      <div><b id="s-rec">0</b><span data-i18n="statRec"></span></div>
      <div><b id="s-tri">0</b><span data-i18n="statTri"></span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-guide" aria-selected="true" type="button" data-i18n="tabGuide"></button>
    <button role="tab" id="tab-new" aria-selected="false" type="button" data-i18n="tabNew"></button>
  </nav>

  <section id="view-guide" style="display:grid;gap:14px">
    <div class="card-note warn" id="remind" hidden>
      <div><strong data-i18n="remT"></strong><p data-i18n="remB"></p></div>
      <div class="row">
        <button class="btn primary" id="remNow" type="button" data-i18n="remNow"></button>
        <button class="btn ghost" id="remLater" type="button" data-i18n="remLater"></button>
      </div>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" data-i18n-ph="search">
      <div class="seg" role="group" id="filter" data-i18n-aria="drink">
        <button type="button" data-v="" aria-pressed="true" data-i18n="all"></button>
        <button type="button" data-v="فلات وايت" aria-pressed="false" data-i18n="flatWhite"></button>
        <button type="button" data-v="كابتشينو" aria-pressed="false" data-i18n="cappuccino"></button>
      </div>
    </div>
    <div class="guide" id="guide"></div>
    <p class="note" id="note" hidden></p>
  </section>

  <form class="panel" id="form" autocomplete="off" hidden>
    <h2 id="formTitle"></h2>
    <div class="grid">
      <label class="full"><span data-i18n="fName"></span>
        <input id="f-name" required data-i18n-ph="phName">
      </label>
      <label class="full"><span data-i18n="fCountry"></span>
        <input id="f-country" data-i18n-ph="phPick">
        <div class="chips" id="c-country" role="group" data-i18n-aria="fCountry"></div>
      </label>
      <label class="full"><span data-i18n="fRoaster"></span>
        <input id="f-roaster" data-i18n-ph="phPick">
        <div class="chips" id="c-roaster" role="group" data-i18n-aria="fRoaster"></div>
      </label>
      <div class="flabel full"><span data-i18n="fGrind"></span>
        <div class="boxed" id="grindBox"></div>
      </div>
      <label><span data-i18n="fTemp"></span>
        <div class="unit"><input id="f-temp" class="num" type="number" inputmode="decimal" step="0.5" min="80" max="100" value="93"><span>°C</span></div>
      </label>

  };
  /* stored values stay Arabic; these give their English labels */
  const LABELS={
    country:{"برازيلي":"Brazil","إثيوبي":"Ethiopia","كولومبي":"Colombia","كيني":"Kenya","يمني":"Yemen","رواندي":"Rwanda","بوروندي":"Burundi","هندوراسي":"Honduras","غواتيمالي":"Guatemala","بنمي":"Panama","كوستاريكي":"Costa Rica","بيروفي":"Peru","سلفادوري":"El Salvador","إندونيسي":"Indonesia","مكسيكي":"Mexico"},

  };
  const LANG_KEY="coffee-recipes-lang";
  let lang="ar";
  try{ const l=localStorage.getItem(LANG_KEY); if(l==="en"||l==="ar") lang=l; }catch(e){}

  const disp=(field,val)=> lang==="en" ? (LABELS[field][val]||val) : val;
  const canon=(field,val)=>{
    const v=norm(val); if(lang!=="en") return v;
    const hit=Object.entries(LABELS[field]).find(([,en])=>en.toLowerCase()===v.toLowerCase());
    return hit?hit[0]:v;
  };

  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const form=$("form"), guide=$("guide"), msg=$("msg"), note=$("note");

  let entries=[], editing=null, filter="", query="", pendingDel=null, persistent=true, view="guide";

  const COUNTRIES=Object.keys(LABELS.country), ROASTERS=Object.keys(LABELS.roaster);
  function chipRow(boxId,inputId,base,field){
    const box=$(boxId), inp=$(inputId);
    const used=[...new Set(entries.map(e=>norm(e[field])).filter(Boolean))];
    const all=[...used.filter(x=>base.includes(x)), ...base.filter(x=>!used.includes(x)), ...used.filter(x=>!base.includes(x))];
    const cur=canon(field,inp.value);
    box.innerHTML=all.map(v=>`<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(disp(field,v))}</button>`).join("");
  }
  function renderChips(){ chipRow("c-country","f-country",COUNTRIES,"country"); chipRow("c-roaster","f-roaster",ROASTERS,"roaster"); }
  [["c-country","f-country","country"],["c-roaster","f-roaster","roaster"]].forEach(([b,i,field])=>{
    $(b).addEventListener("click",e=>{
      const c=e.target.closest(".chip"); if(!c) return;
      const inp=$(i); inp.value = canon(field,inp.value)===c.dataset.v ? "" : disp(field,c.dataset.v);
      renderChips();
    });
    $(i).addEventListener("input",renderChips);
  });

  const SET_KEY="coffee-recipes-settings";
  const DEFAULT_SET={machine:"Slayer Single Group",grinders:[{id:"monolith",name:"Monolith"},{id:"hg1",name:"HG-1"}],theme:"dark",fontScale:1};
  let settings=JSON.parse(JSON.stringify(DEFAULT_SET));
  try{ const raw=localStorage.getItem(SET_KEY); if(raw){ const o=JSON.parse(raw); if(o&&Array.isArray(o.grinders)) settings={...DEFAULT_SET,...o,machine:o.machine||""}; } }catch(e){}
  function saveSettings(){ try{ localStorage.setItem(SET_KEY,JSON.stringify(settings)); }catch(e){} }
  const activeGrinders=()=>settings.grinders.filter(g=>!g.archived);
  const gName=id=>{ const g=settings.grinders.find(x=>x.id===id); return (g&&g.name)||(g?T("grinder"):id); };
  function migrate(e){
    if(!e||typeof e!=="object") return e;
    if(!e.grind||typeof e.grind!=="object"){
      e.grind={};
      if(has(e.monolith)) e.grind.monolith=String(e.monolith);
      if(has(e.hg1)) e.grind.hg1=String(e.hg1);
    }
    delete e.monolith; delete e.hg1;
    if(!Array.isArray(e.prefGrinders)){ e.prefGrinders= e.prefGrinder?[e.prefGrinder]:[]; }
    delete e.prefGrinder;
    return e;
  }

    const o={}; $("grindBox").querySelectorAll("input[data-g]").forEach(i=>{ if(i.value.trim()) o[i.dataset.g]=i.value.trim(); }); return o;
  }
  let prefG=new Set();
  const prefsOf=e=> Array.isArray(e.prefGrinders)?e.prefGrinders:(e.prefGrinder?[e.prefGrinder]:[]);

    const gs=activeGrinders();
    $("grindBox").innerHTML = gs.length
      ? gs.map(g=>{ const nm=g.name||T("grinder"), on=prefG.has(g.id), fid="gi-"+g.id;

            <div class="g-head">
              <label class="lbl-tag" for="${esc(fid)}">${esc(nm.toUpperCase())}</label>
              <button type="button" class="pref" data-pref="${esc(g.id)}" aria-pressed="${on}" aria-label="${esc(T("prefLabel")+": "+nm)}">${T("prefBtn")}</button>
            </div>
            <input id="${esc(fid)}" class="num" inputmode="decimal" placeholder="—" data-g="${esc(g.id)}" value="${esc(values[g.id]??"")}">
          </div>`; }).join("")
      : `<p class="hint">${T("noGrinders")}</p>`;
  }
  $("grindBox").addEventListener("click",e=>{
    const b=e.target.closest("button[data-pref]"); if(!b) return;
    const id=b.dataset.pref; prefG.has(id)?prefG.delete(id):prefG.add(id);
    b.setAttribute("aria-pressed",String(prefG.has(id)));
  });
  let pendingRemove=null;
  function renderSettings(){
    $("s-machine").value=settings.machine||"";
    const gs=activeGrinders();
    $("grinderList").innerHTML=gs.map(g=>`<div class="g-row">
        <input data-gid="${esc(g.id)}" value="${esc(g.name)}" placeholder="${esc(T("phGrinder"))}" aria-label="${esc(T("phGrinder"))}">
        <button class="icon ${pendingRemove===g.id?"confirm":""}" data-rm="${esc(g.id)}" type="button">${pendingRemove===g.id?T("gConfirm"):T("gRemove")}</button>
      </div>`).join("");
  }
  function applyLook(){
    const root=document.documentElement, t=settings.theme==="light"?"light":"dark";
    root.setAttribute("data-theme",t);
    root.style.setProperty("--fs",settings.fontScale||1);
    $("themeColor").setAttribute("content",t==="light"?"#eef0ee":"#141917");
    setSeg($("s-theme"),t); setSeg($("s-font"),String(settings.fontScale||1));
  }
  $("s-theme").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; settings.theme=b.dataset.v; saveSettings(); applyLook(); };
  $("s-font").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; settings.fontScale=Number(b.dataset.v); saveSettings(); applyLook(); };
  $("s-machine").addEventListener("input",e=>{ settings.machine=e.target.value; saveSettings(); renderGear(); });
  $("grinderList").addEventListener("input",e=>{
    const id=e.target.dataset.gid; if(!id) return;
    const g=settings.grinders.find(x=>x.id===id); if(!g) return;
    g.name=e.target.value; saveSettings(); renderGear();
  });
  $("grinderList").addEventListener("click",e=>{
    const b=e.target.closest("button[data-rm]"); if(!b) return;
    const id=b.dataset.rm;
    if(pendingRemove!==id){ pendingRemove=id; renderSettings(); setTimeout(()=>{ if(pendingRemove===id){ pendingRemove=null; renderSettings(); } },4000); return; }
    pendingRemove=null;
    const used=entries.some(x=>x.grind&&has(x.grind[id]));
    if(used) settings.grinders.find(x=>x.id===id).archived=true;
    else settings.grinders=settings.grinders.filter(x=>x.id!==id);
    saveSettings(); renderSettings(); renderGear(); render();
  });
  $("addGrinder").onclick=()=>{
    const id="g"+Date.now().toString(36);
    settings.grinders.push({id,name:""}); saveSettings(); renderSettings();
    const inp=$("grinderList").querySelector(`input[data-gid="${id}"]`); if(inp) inp.focus();
  };
  $("setBtn").onclick=()=>show(view==="settings"?"guide":"settings");
  $("setDone").onclick=()=>{
    settings.grinders=settings.grinders.filter(g=>g.archived||norm(g.name)); /* drop blank new rows */
    saveSettings(); renderGear(); render(); show("guide");
  };

  /* ---------- views ---------- */
  function show(tab){
    if(view==="settings" && tab!=="settings"){ settings.grinders=settings.grinders.filter(g=>g.archived||norm(g.name)); saveSettings(); renderGear(); render(); }
    if(tab==="new" && view==="settings") renderGrindInputs(readGrindInputs());
    view=tab; const g= tab==="guide", n= tab==="new", st= tab==="settings";
    $("tab-guide").setAttribute("aria-selected",String(g));
    $("tab-new").setAttribute("aria-selected",String(n));
    $("setBtn").setAttribute("aria-pressed",String(st));
    $("view-guide").hidden=!g; $("backup").hidden=!g; form.hidden=!n; $("settings").hidden=!st;
    if(n){ renderChips(); $("f-name").focus({preventScroll:true}); }
    if(st){ pendingRemove=null; renderSettings(); }
  }
  $("tab-guide").onclick=()=>show("guide");
  $("tab-new").onclick=()=>{ if(!editing) resetForm(); show("new"); };

  const setSeg=(el,v)=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  const segVal=el=>el.querySelector('[aria-pressed="true"]').dataset.v;
  $("f-drink").onclick=e=>{const b=e.target.closest("button"); if(b) setSeg($("f-drink"),b.dataset.v);};
  $("filter").onclick=e=>{const b=e.target.closest("button"); if(!b) return; filter=b.dataset.v; setSeg($("filter"),filter); render();};
  $("q").oninput=e=>{query=e.target.value.trim(); render();};

  /* ---------- render ---------- */
  const keyOf=e=>[norm(e.name),norm(e.roaster),e.drink||""].join("|");
  const fmtDate=t=>{ if(!t) return ""; return new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
  const val=x=>{
    if(!has(x)) return '<b class="none">—</b>';
    const m=String(x).trim().match(/^([\d.,٠-٩]+)\s*(.*)$/);
    return m ? `<b>${esc(m[1])}${m[2]?`<em>${esc(m[2])}</em>`:""}</b>` : `<b>${esc(x)}</b>`;
  };
  function grindIds(e){
    const g=e.grind||{};
    const ids=activeGrinders().map(x=>x.id);
    Object.keys(g).forEach(id=>{ if(has(g[id]) && !ids.includes(id)) ids.push(id); });
    return ids;
  }
  function grindReadout(e){
    const ids=grindIds(e), g=e.grind||{};
    const cols=Math.min(ids.length+1,4);
    return `<div class="readout" style="--cols:${cols}">
      ${ids.map(id=>`<div><small>${prefsOf(e).includes(id)?`<i class="pdot" role="img" aria-label="${esc(T("prefLabel"))}"></i>`:""}${esc(gName(id))}</small>${val(g[id])}</div>`).join("")}
      <div><small>Temp °C</small>${val(e.temp)}</div>
    </div>`;
  }
  function ratioLine(e){
    if(!has(e.dose)&&!has(e.yield)&&!has(e.time)) return "";
    const r=(has(e.dose)&&has(e.yield)&&Number(e.dose)>0)?"1:"+(Number(e.yield)/Number(e.dose)).toFixed(1):"";
    const dy=(has(e.dose)||has(e.yield))?`<b>${has(e.dose)?esc(e.dose):"—"}<span class="arr">→</span>${has(e.yield)?esc(e.yield):"—"}<em>g</em></b>`:'<b class="none">—</b>';
    return `<div class="readout sub">
      <div><small>In → Out</small>${dy}</div>
      <div><small>Ratio</small>${r?`<b>${r}</b>`:'<b class="none">—</b>'}</div>
      <div><small>Time</small>${has(e.time)?`<b>${esc(e.time)}<em>s</em></b>`:'<b class="none">—</b>'}</div>
    </div>`;
  }
  function tools(e,isMain){
    const del=pendingDel===e.id;
    return `<div class="tools">
      ${e.fav?"":`<button class="icon star" data-act="fav" data-id="${esc(e.id)}" type="button">${T("aFav")}</button>`}
      ${isMain?`<button class="icon" data-act="share" data-id="${esc(e.id)}" type="button">${T("aShare")}</button>`:""}
      <button class="icon" data-act="dup" data-id="${esc(e.id)}" type="button">${isMain?T("aTry"):T("aDup")}</button>
      <button class="icon" data-act="edit" data-id="${esc(e.id)}" type="button">${T("aEdit")}</button>
      <button class="icon ${del?"confirm":""}" data-act="del" data-id="${esc(e.id)}" type="button">${del?T("aConfirm"):T("aDel")}</button>
    </div>`;
  }
  function render(){
    const groups=new Map();
    entries.forEach(e=>{const k=keyOf(e); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e);});
    let list=[...groups.entries()].map(([k,items])=>{
      items.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const main=items.find(x=>x.fav)||items[0];
      return {k,items,main,approved:!!items.find(x=>x.fav)};
    });
    $("s-rec").textContent=list.filter(g=>g.approved).length;
    $("s-tri").textContent=entries.length;

    if(filter) list=list.filter(g=>g.main.drink===filter);
    if(query){
      const q=query.toLowerCase();
      list=list.filter(g=>{const m=g.main; return [m.name,m.country,m.roaster,disp("country",m.country),disp("roaster",m.roaster)].some(x=>String(x||"").toLowerCase().includes(q));});
    }
    list.sort((a,b)=>(b.approved-a.approved)||((b.items[0].createdAt||0)-(a.items[0].createdAt||0)));

    if(!list.length){
      guide.innerHTML = entries.length
        ? `<div class="empty"><strong>${T("noResT")}</strong>${T("noResB")}</div>`
        : `<div class="empty"><strong>${T("emptyT")}</strong>${esc(T("emptyB"))}</div>`;
      return;
    }
    guide.innerHTML=list.map(g=>{
      const m=g.main, others=g.items.filter(x=>x!==m);
      const meta=[m.country&&disp("country",m.country), m.roaster&&disp("roaster",m.roaster)].filter(Boolean).map(esc).join(" · ")||"—";
      return `<article class="recipe">
        <div class="r-head">
          <div style="min-width:0">
            <h3>${esc(m.name||T("unnamed"))}${m.example?`<span class="ex">${T("example")}</span>`:""}</h3>
            <p class="meta">${meta}</p>
          </div>
          <span class="pill ${m.drink==="كابتشينو"?"cap":""}">${esc(disp("drink",m.drink||""))}</span>
        </div>
        <div class="status ${g.approved?"ok":""}"><i></i>${g.approved?T("approved"):T("latest")}</div>
        <div class="dial">
          ${grindReadout(m)}
          ${ratioLine(m)}
        </div>
        ${has(m.notes)?`<p class="notes">${esc(m.notes)}</p>`:""}
        <div class="r-foot"><span class="date">${fmtDate(m.createdAt)}</span>${tools(m,true)}</div>
        ${others.length?`<details class="trials" data-k="${esc(g.k)}" ${openGroups.has(g.k)?"open":""}>
          <summary>${T("prev",others.length)}</summary>
          ${others.map(t=>`<div class="trial">
            <div class="t-spec">${grindIds(t).map(id=>`${prefsOf(t).includes(id)?`<i class="pdot" role="img" aria-label="${esc(T("prefLabel"))}"></i>`:""}${esc(gName(id))} ${has((t.grind||{})[id])?esc(t.grind[id]):"—"}`).join(" · ")}${grindIds(t).length?" · ":""}${has(t.temp)?esc(t.temp)+"°C":"—"}${has(t.dose)?` · ${esc(t.dose)}→${has(t.yield)?esc(t.yield):"—"}g`:""}${has(t.time)?` · ${esc(t.time)}s`:""} · <span style="color:var(--muted)">${fmtDate(t.createdAt)}</span></div>
            ${tools(t,false)}
            ${has(t.notes)?`<p class="t-note">${esc(t.notes)}</p>`:""}
          </div>`).join("")}
        </details>`:""}
      </article>`;
    }).join("");
    guide.querySelectorAll("details.trials").forEach(d=>d.addEventListener("toggle",()=>{d.open?openGroups.add(d.dataset.k):openGroups.delete(d.dataset.k);}));
  }

  /* ---------- form ---------- */
  function fill(e){
    $("f-name").value=e.name||"";
    $("f-country").value=e.country?disp("country",e.country):"";
    $("f-roaster").value=e.roaster?disp("roaster",e.roaster):"";
    prefG=new Set(prefsOf(e)); renderGrindInputs(e.grind||{}); $("f-temp").value=e.temp??93;
    $("f-dose").value=e.dose??""; $("f-yield").value=e.yield??""; $("f-time").value=e.time??""; $("f-notes").value=e.notes||"";
    $("more").open= has(e.dose)||has(e.yield)||has(e.time)||has(e.notes);
    setSeg($("f-drink"),e.drink||"فلات وايت");
    renderChips();
  }
  function resetForm(){
    editing=null; form.reset(); prefG=new Set(); renderGrindInputs({}); $("f-temp").value=93; setSeg($("f-drink"),"فلات وايت"); $("more").open=false;
    $("formTitle").textContent=T("formNew"); $("save").textContent=T("save"); msg.textContent="";
  }
  $("cancel").onclick=()=>{resetForm(); show("guide");};

  /* ---------- storage ---------- */
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(entries)); }catch(e){ persistent=false; banner(); } }
  function load(){ try{ const raw=localStorage.getItem(KEY); return raw===null?null:JSON.parse(raw); }catch(e){ persistent=false; return null; } }
  function banner(){ if(!persistent){ note.hidden=false; note.textContent=T("storageOff"); } }
  function write(id,body){
    const i=entries.findIndex(x=>x.id===id);
    if(i>-1) entries[i]={id,...body}; else entries.unshift({id,...body});
    entries.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); save(); touch(); render();
  }
  const strip=e=>{const {id,...rest}=e; return rest;};
  function makeFav(id){
    const e=entries.find(x=>x.id===id); if(!e) return;
    const k=keyOf(e);
    entries.filter(x=>keyOf(x)===k && x.fav && x.id!==id).forEach(o=>write(o.id,{...strip(o),fav:false}));
    write(id,{...strip(e),fav:true});
  }

  guide.addEventListener("click",ev=>{
    const b=ev.target.closest("button[data-act]"); if(!b) return;
    const id=b.dataset.id, e=entries.find(x=>x.id===id); if(!e) return;
    const act=b.dataset.act;
    if(act==="fav") makeFav(id);
    if(act==="share") shareRecipe(e);
    if(act==="edit"){ resetForm(); editing=id; fill(e); $("f-fav").checked=!!e.fav; $("formTitle").textContent=T("formEdit"); $("save").textContent=T("saveEdit"); show("new"); }
    if(act==="dup"){ resetForm(); fill(e); $("f-notes").value=""; msg.className="msg"; msg.textContent=T("dupMsg"); show("new"); }
    if(act==="del"){
      if(pendingDel!==id){ pendingDel=id; render(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null; render();} },4000); return; }
      pendingDel=null; entries=entries.filter(x=>x.id!==id); save(); touch(); render();
    }
  });

  form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const name=norm($("f-name").value);
    if(!name){ msg.className="msg err"; msg.textContent=T("errName"); $("f-name").focus(); return; }
    const num=x=>x===""?"":Number(x);
    const old=editing?entries.find(x=>x.id===editing):null;
    const body={ name, country:canon("country",$("f-country").value), roaster:canon("roaster",$("f-roaster").value),
      grind:(()=>{ const keep={}; if(old&&old.grind){ const act=activeGrinders().map(x=>x.id); Object.entries(old.grind).forEach(([k,v])=>{ if(!act.includes(k)) keep[k]=v; }); } return {...keep,...readGrindInputs()}; })(),
      prefGrinders:(()=>{ const act=activeGrinders().map(x=>x.id); const kept=old?prefsOf(old).filter(id=>!act.includes(id)):[]; return [...kept,...act.filter(id=>prefG.has(id))]; })(),
      temp:num($("f-temp").value),
      drink:segVal($("f-drink")), dose:num($("f-dose").value), yield:num($("f-yield").value), time:num($("f-time").value),
      notes:$("f-notes").value.trim(), fav:false, createdAt: old?.createdAt||Date.now() };
    if(old) body.updatedAt=Date.now();
    try{
      const id= editing || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      write(id,body);
      if($("f-fav").checked) makeFav(id);
      resetForm(); show("guide");
    }catch(err){ msg.className="msg err"; msg.textContent=T("errSave"); }
  });

  /* ---------- backup ---------- */
  $("exportBtn").onclick=()=>{
    const data={app:"coffee-recipes",version:VERSION,exportedAt:new Date().toISOString(),settings,entries};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const fname="coffee-recipes-"+new Date().toISOString().slice(0,10)+".json";
    const done=()=>{ $("bkMsg").textContent=T("exported"); meta.lastExport=Date.now(); saveMeta(); paintRemind(); };
    if(isIOS && window.File && navigator.canShare){
      try{
        const file=new File([blob],fname,{type:"application/json"});
        if(navigator.canShare({files:[file]})){ navigator.share({files:[file],title:fname}).then(done).catch(()=>{}); return; }
      }catch(e){}
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    done(); return;
  };
  $("importBtn").onclick=()=>$("importFile").click();
  $("importFile").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text()); const list=Array.isArray(d)?d:d.entries;
      if(!Array.isArray(list)) throw 0;
      if(d&&d.settings&&Array.isArray(d.settings.grinders)){ settings={...DEFAULT_SET,...d.settings,machine:d.settings.machine||""}; saveSettings(); renderGear(); applyLook(); }
      let n=0; list.forEach(x=>{ if(x&&x.id&&x.name){ migrate(x); const i=entries.findIndex(y=>y.id===x.id); if(i>-1) entries[i]=x; else entries.push(x); n++; } });
      entries.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); save(); render(); renderChips(); renderGrindInputs(readGrindInputs());
      $("bkMsg").textContent=T("imported",n);
    }catch(err){ $("bkMsg").textContent=T("badFile"); }
    e.target.value="";
  };

  /* ---------- meta: backup reminder ---------- */
  const META_KEY="coffee-recipes-meta", DAY=864e5;
  let meta={};
  try{ meta=JSON.parse(localStorage.getItem(META_KEY)||"{}")||{}; }catch(e){ meta={}; }
  if(!meta.firstUse){ meta.firstUse=Date.now(); }
  function saveMeta(){ try{ localStorage.setItem(META_KEY,JSON.stringify(meta)); }catch(e){} }
  saveMeta();
  function touch(){ meta.lastChange=Date.now(); saveMeta(); paintRemind(); }
  function paintRemind(){
    const now=Date.now(), since=meta.lastExport||meta.firstUse;
    const due= entries.length>0 && (meta.lastChange||0)>(meta.lastExport||0) && now-since>14*DAY && now>(meta.snoozeUntil||0);
    $("remind").hidden=!due;
  }
  $("remNow").onclick=()=>$("exportBtn").click();
  $("remLater").onclick=()=>{ meta.snoozeUntil=Date.now()+3*DAY; saveMeta(); paintRemind(); };

  /* ---------- install ---------- */
  let deferredInstall=null;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const isStandalone=()=> (window.matchMedia&&matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
  function paintInstall(){
    const hide= isStandalone() || meta.installHidden || meta.installed;
    $("installCard").hidden=!!hide;
    $("instBtn").hidden=!deferredInstall;
    $("instManual").hidden=!!deferredInstall;
    $("instManual").textContent= isIOS ? T("instIOS") : T("instManual");
  }
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; paintInstall(); });
  window.addEventListener("appinstalled",()=>{ deferredInstall=null; meta.installed=true; saveMeta(); paintInstall(); });
  $("instBtn").onclick=async()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall=null; paintInstall();
  };
  $("instHide").onclick=()=>{ meta.installHidden=true; saveMeta(); paintInstall(); };

  /* ---------- share ---------- */
  let toastTimer=null;
  function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2200); }
  function recipeText(e){
    const g=e.grind||{};
    const lines=["☕ "+(e.name||T("unnamed"))];
    const origin=[e.country&&disp("country",e.country), e.roaster&&disp("roaster",e.roaster)].filter(Boolean).join(" · ");
    if(origin) lines.push(origin);
    lines.push(disp("drink",e.drink||"")+(e.fav?" · "+T("approvedTag"):""));
    const grind=grindIds(e).filter(id=>has(g[id])).map(id=>gName(id)+" "+g[id]+(prefsOf(e).includes(id)?" "+T("prefShare"):"")).join(" · ");
    if(grind) lines.push(T("fGrind")+": "+grind);
    const spec=[];
    if(has(e.temp)) spec.push(e.temp+"°C");
    if(has(e.dose)||has(e.yield)) spec.push((has(e.dose)?e.dose:"—")+"g → "+(has(e.yield)?e.yield:"—")+"g"+(has(e.dose)&&has(e.yield)&&Number(e.dose)>0?" (1:"+(e.yield/e.dose).toFixed(1)+")":""));
    if(has(e.time)) spec.push(e.time+"s");
    if(spec.length) lines.push(spec.join(" · "));
    if(has(e.notes)) lines.push("", e.notes);
    return lines.join("\n");
  }
  async function shareRecipe(e){
    const text=recipeText(e);
    if(navigator.share){
      try{ await navigator.share({title:e.name||T("title"),text}); return; }
      catch(err){ if(err&&err.name==="AbortError") return; }
    }
    try{ await navigator.clipboard.writeText(text); toast(T("copied")); }
    catch(err){ toast(T("shareFail")); }
  }

  /* ---------- updates ---------- */
  let latest=null, updState="idle"; /* idle | checking | latest | new | fail */
  const newer=(a,b)=>{ const x=a.split(".").map(Number), y=b.split(".").map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; };
  function paintUpd(){
    const b=$("updBtn"), m=$("updMsg");
    b.disabled= updState==="checking";
    b.classList.toggle("new", updState==="new");
    b.textContent= updState==="checking"?T("upChecking"): updState==="new"?T("upGo","v"+latest):T("upCheck");
    m.className= "msg"+(updState==="fail"?" err":"");
    m.textContent= updState==="latest"?T("upLatest"): updState==="new"?T("upNew"): updState==="fail"?T("upFail"): updState==="done"?T("upDone","v"+VERSION):"";
  }
  async function checkUpdate(silent){
    if(!silent){ updState="checking"; paintUpd(); }
    try{
      const res=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
      if(!res.ok) throw 0;
      const m=(await res.text()).match(/const VERSION="([\d.]+)"/);
      if(!m) throw 0;
      latest=m[1];
      if(newer(latest,VERSION)) updState="new";
      else if(!silent) updState="latest";
    }catch(e){ if(!silent) updState="fail"; }
    paintUpd();
  }
  $("updBtn").onclick=()=>{
    if(updState==="new"){ location.replace(location.pathname+"?v="+latest+"&t="+Date.now()); return; }
    checkUpdate(false);
  };
  /* after an update, tidy the address bar and confirm */
  (()=>{ const q=new URLSearchParams(location.search); if(q.has("v")){ if(q.get("v")===VERSION) updState="done"; try{ history.replaceState(null,"",location.pathname); }catch(e){} } })();

  /* ---------- start ---------- */
  const saved=load();
  entries= (saved ?? SEED).map(migrate);
  if(persistent) save();
  resetForm();
  applyLang();
  applyLook(); paintRemind(); paintInstall();
  if(location.protocol.startsWith("http")) checkUpdate(true);
  if("serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
